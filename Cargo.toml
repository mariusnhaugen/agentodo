[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/smiil/agentodo"

[workspace.dependencies]
agentodo-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
